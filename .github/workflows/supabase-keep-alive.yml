name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 * * *' # 每天运行一次
  workflow_dispatch:

jobs:
  wake_up:
    runs-on: ubuntu-latest
    steps:
      # --- 第一个项目 (ai-virtual-tryon) ---
      - name: Wake up Project 1 (Tryon)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "正在唤醒项目 1..."
          response=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "项目 1 状态码: $response"

      # --- 第二个项目 (youtube-video-analyzer) ---
      - name: Wake up Project 2 (YouTube)
        env:
          # 注意这里引用的是步骤二里新加的带 _2 后缀的变量
          SUPABASE_URL: ${{ secrets.SUPABASE_URL_2 }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY_2 }}
        run: |
          echo "正在唤醒项目 2..."
          response=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "项目 2 状态码: $response"
